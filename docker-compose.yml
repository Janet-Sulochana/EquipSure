version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: equipsure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: equipsure
      POSTGRES_PASSWORD: equipsure_secure_password_2026
      POSTGRES_DB: equipsuredb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipsure -d equipsuredb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - equipsure-net

  redis:
    image: redis:7-alpine
    container_name: equipsure-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - equipsure-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: equipsure-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: equipsure
      PGPASSWORD: equipsure_secure_password_2026
      PGDATABASE: equipsuredb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: equipsure_super_secret_jwt_key_2026_healthcare_security
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - equipsure-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: equipsure-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - equipsure-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  equipsure-net:
    driver: bridge
